<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>GAP rácsos</title>
<style>
#grid-container{
    border: 1px solid black;
    background-color: rgb(150, 203, 177);
    display: grid;
    grid-template-columns: auto auto auto;
    gap: 20px 50px
}
#grid-container > div {
    border: 1px solid black;
    background-color: yellow;

}
</style>




</head>
<body>
    <h1>a gép tulajdonsága rács nélkül</h1>
    <p> A <em>gap</em>tulajdonsággal adhatjuk meg a sorok és oszlopok közöti távolság.</p>
    <p>a rácsnak a sorai közöt 20px, az oszlopai közöt pedig 50px a távolság </p>
    <div id="grid-container">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>7</div>
<div>8</div>
<div>9</div>
    </body>
</html>
